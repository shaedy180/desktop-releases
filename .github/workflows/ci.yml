name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    if: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    name: Release workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - run: node --test .github/scripts/ci-provenance.test.cjs
      - run: node --test scripts/*.test.mjs
      - run: git diff --check

  ci_provenance:
    name: CI provenance
    if: always()
    needs: ["validate"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - name: Test verification safeguards
        run: node --test .github/scripts/ci-provenance.test.cjs
      - name: Record PR validation or verify merged source
        id: receipt
        uses: actions/github-script@v8
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS: '["validate"]'
        with:
          script: |
            await require('./.github/scripts/ci-provenance.cjs')({ github, context, core });
      - name: Preserve successful PR validation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ci-validation.json
          if-no-files-found: error
          retention-days: 90
