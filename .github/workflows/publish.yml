name: Publish Desktop
run-name: Desktop ${{ inputs.version }} from ${{ inputs.source_sha }} for CaseSim ${{ inputs.casesim_sha }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact staged CaseSim Desktop version
        required: true
        type: string
      source_sha:
        description: Full validated public CaseSim-Desktop source SHA from private preparation
        required: true
        type: string
      casesim_sha:
        description: Full approved CaseSim compatibility SHA from private preparation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: desktop-release
      url: https://releases.shaedy.de/casesim/windows/latest.json
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CASESIM_SHA: ${{ inputs.casesim_sha }}
      RELEASE_HOST: ${{ secrets.DESKTOP_PUBLISH_HOST }}
      RELEASE_USER: ${{ secrets.DESKTOP_PUBLISH_USER }}
      RELEASE_KEY: ${{ secrets.DESKTOP_PUBLISH_SSH_KEY }}
      RELEASE_FINGERPRINT: ${{ secrets.DESKTOP_PUBLISH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - name: Require protected hosting before any promotion
        run: node scripts/verify-release.mjs --gate
      - name: Publish only the approved staged release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CASESIM_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$RELEASE_HOST" && test -n "$RELEASE_USER" && test -n "$RELEASE_KEY"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release-key" "$RUNNER_TEMP/release-hosts"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/release-key"
          ssh-keyscan -T 10 -t ed25519 "$RELEASE_HOST" > "$RUNNER_TEMP/release-hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/release-hosts" -E sha256 | awk '{print $2}')" = "$RELEASE_FINGERPRINT"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/release-hosts" -i "$RUNNER_TEMP/release-key" "$RELEASE_USER@$RELEASE_HOST" "publish $VERSION $SOURCE_SHA $CASESIM_SHA" > "$RUNNER_TEMP/release-receipt.json"
      - name: Verify authenticated publication receipt and protected channel
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --receipt "$RUNNER_TEMP/release-receipt.json"
          printf 'Published [CaseSim Desktop %s](https://releases.shaedy.de/) from Desktop `%s`, approved for CaseSim `%s`. Controller-verified signatures, identities and exact file hashes; browser login and native download grants required.\n' "$VERSION" "$SOURCE_SHA" "$CASESIM_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verified non-secret publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: Desktop-${{ inputs.version }}-publication-receipt
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
          retention-days: 90
